server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Workflows directory — serve both listing and files
    location /workflows/ {
        alias /usr/share/nginx/html/workflows/;
        # CORS: restrict to dashboard origin (self)
        set $cors_origin "";
        if ($http_origin ~* "^https?://hermesfy\.(.*)\.nip\.io$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin ~* "^https?://46\.224\.58\.239(.*)$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        autoindex on;
        autoindex_format json;
    }

    # JSON files anywhere
    location ~* \.json$ {
        set $cors_origin "";
        if ($http_origin ~* "^https?://hermesfy\.(.*)\.nip\.io$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin ~* "^https?://46\.224\.58\.239(.*)$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
