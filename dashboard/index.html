<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermesfy Studio — Workflow Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   CLAWFY STUDIO — ANTIGRAVITY MODE
   Design System Tokens (Dark Mode)
   ═══════════════════════════════════════════════════════ */
:root {
  --background: #0A0E14;
  --foreground: #E6FFF9;
  --mint-base: #A8E6CF;
  --mint-deep: #7FDBCA;
  --electric-mint: #00FFC6;
  --glitch-cyan: #00E5FF;
  --node-fill: #0D1117;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --font-sans: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Derived tokens */
  --fg-dim: rgba(230,255,249,0.55);
  --fg-muted: rgba(230,255,249,0.3);
  --red: #FF6464;
  --red-dim: rgba(255,100,100,0.08);
  --amber: #f59e0b;
  --border: rgba(168,230,207,0.08);
  --border-hover: rgba(168,230,207,0.18);
  --glass-bg: rgba(13,17,23,0.65);
  --glass-border: rgba(127,219,202,0.20);
  --radius: 10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  font-family: var(--font-sans);
  background: var(--background);
  color: var(--foreground);
  min-height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}

/* ═══ CRT OVERLAY ═══════════════════════════════════════ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.06) 0px,
    rgba(0,0,0,0.06) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity: 0.04;
}

/* Subtle vignette for depth */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9997;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.3) 100%);
}

/* ═══ APP GRID ══════════════════════════════════════════ */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: auto 1fr;
  height: 100dvh;
  position: relative;
  z-index: 1;
}

/* ═══ HEADER ════════════════════════════════════════════ */
.header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
  position: relative;
}

/* Electric mint accent line under header */
.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--mint-base) 20%,
    var(--electric-mint) 50%,
    var(--mint-base) 80%,
    transparent 100%
  );
  opacity: 0.25;
}

.header-left { display: flex; align-items: baseline; gap: 16px; }

.header h1 {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--foreground) 0%, var(--mint-base) 50%, var(--electric-mint) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header .subtitle {
  font-size: 12px;
  color: var(--fg-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.header-right { display: flex; align-items: center; gap: 12px; }

.wf-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  background: var(--node-fill);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

/* ═══ SIDEBAR — GLASSMORPHISM ══════════════════════════ */
.sidebar {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-right: 1px solid var(--glass-border);
  box-shadow: inset -1px 0 0 rgba(255,255,255,0.03);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 18px 18px 10px;
  font-size: 10px;
  font-weight: 600;
  color: var(--mint-deep);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.sidebar-list { flex: 1; padding: 0 8px; }

/* ═══ WORKFLOW LIST ITEM ════════════════════════════════ */
.wf-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
  margin: 2px 0;
  cursor: pointer;
  border-radius: var(--radius-sm);
  border-left: 3px solid transparent;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.wf-item:hover {
  background: rgba(168,230,207,0.04);
}

.wf-item.active {
  border-left-color: var(--electric-mint);
  background: rgba(0,255,198,0.04);
  box-shadow: 0 0 20px rgba(0,255,198,0.06), inset 0 0 20px rgba(0,255,198,0.02);
}

.wf-item:active {
  transform: scale(0.985);
}

.wf-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--foreground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wf-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
}

/* ═══ STATE DOTS ════════════════════════════════════════ */
.state-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.state-dot.pending { background: var(--fg-muted); }
.state-dot.running {
  background: var(--glitch-cyan);
  box-shadow: 0 0 8px var(--glitch-cyan);
  animation: pulse-cyan 2s ease-in-out infinite;
}
.state-dot.completed {
  background: var(--electric-mint);
  box-shadow: 0 0 8px rgba(0,255,198,0.5);
}
.state-dot.failed {
  background: var(--red);
  box-shadow: 0 0 8px rgba(255,100,100,0.5);
}

@keyframes pulse-cyan {
  0%, 100% { box-shadow: 0 0 4px var(--glitch-cyan); }
  50% { box-shadow: 0 0 12px var(--glitch-cyan), 0 0 24px rgba(0,229,255,0.2); }
}

/* ═══ SIDEBAR FOOTER ════════════════════════════════════ */
.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--glass-border);
}

/* ═══ BUTTONS ═══════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid var(--glass-border);
  background: var(--node-fill);
  color: var(--foreground);
  width: 100%;
  letter-spacing: 0.01em;
}

.btn:hover {
  border-color: var(--mint-deep);
  background: rgba(127,219,202,0.06);
  box-shadow: 0 0 12px rgba(127,219,202,0.08);
}

.btn:active { transform: translateY(1px) scale(0.98); }

.btn-primary {
  background: var(--electric-mint);
  color: var(--background);
  border-color: transparent;
  font-weight: 600;
}

.btn-primary:hover {
  box-shadow: 0 0 20px rgba(0,255,198,0.3), 0 4px 16px rgba(0,255,198,0.15);
  background: #00e6b8;
}

.btn-primary:active { transform: translateY(1px) scale(0.97); }

.file-input-wrap { position: relative; overflow: hidden; }
.file-input-wrap input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}

/* ═══ MAIN PANEL ════════════════════════════════════════ */
.main {
  overflow-y: auto;
  padding: 28px 36px;
  background: var(--background);
}

/* ═══ EMPTY STATE ═══════════════════════════════════════ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
}

.empty-icon {
  width: 56px;
  height: 56px;
  border: 2px dashed var(--glass-border);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--mint-deep);
  font-size: 22px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.empty-text {
  font-size: 13px;
  color: var(--fg-muted);
  letter-spacing: 0.02em;
}

/* ═══ WORKFLOW HEADER ═══════════════════════════════════ */
.wf-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.wf-header h2 {
  font-family: var(--font-sans);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.wf-id {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
  background: var(--node-fill);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

/* ═══ STATUS BADGE ══════════════════════════════════════ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 9999px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  transition: all 0.2s ease;
}

.badge-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.badge.pending {
  background: var(--node-fill);
  color: var(--fg-muted);
  border: 1px solid var(--border);
}

.badge.running {
  background: rgba(0,229,255,0.08);
  color: var(--glitch-cyan);
  border: 1px solid rgba(0,229,255,0.25);
  box-shadow: 0 0 12px rgba(0,229,255,0.1);
}

.badge.completed {
  background: rgba(0,255,198,0.08);
  color: var(--electric-mint);
  border: 1px solid rgba(0,255,198,0.25);
  box-shadow: 0 0 12px rgba(0,255,198,0.1);
}

.badge.failed {
  background: var(--red-dim);
  color: var(--red);
  border: 1px solid rgba(255,100,100,0.25);
  box-shadow: 0 0 12px rgba(255,100,100,0.08);
}

/* ═══ SECTION LABEL ═════════════════════════════════════ */
.section-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--mint-deep);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--glass-border), transparent);
}

/* ═══ DAG CANVAS ════════════════════════════════════════ */
.dag-section { margin-bottom: 28px; }

.dag-canvas {
  background: var(--node-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 36px 28px;
  position: relative;
  overflow-x: auto;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.03),
    0 4px 24px rgba(0,0,0,0.3);
}

/* Dot grid */
.dag-canvas::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(168,230,207,0.12) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  border-radius: var(--radius);
}

.dag-flow {
  display: flex;
  align-items: center;
  gap: 0;
  min-width: max-content;
  position: relative;
  z-index: 1;
}

/* ═══ NODE CARD ═════════════════════════════════════════ */
.node-card {
  background: rgba(13,17,23,0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  padding: 16px 18px;
  min-width: 230px;
  max-width: 300px;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  position: relative;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 2px 8px rgba(0,0,0,0.3);
}

.node-card:hover {
  border-color: rgba(168,230,207,0.3);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 8px 32px rgba(0,0,0,0.4),
    0 0 0 1px rgba(168,230,207,0.1);
  transform: translateY(-2px);
}

.node-card.selected {
  border-color: var(--electric-mint);
  box-shadow:
    0 0 0 2px rgba(0,255,198,0.15),
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 8px 32px rgba(0,0,0,0.4),
    0 0 40px rgba(0,255,198,0.08);
}

/* State-based styling */
.node-card.pending {
  border-color: rgba(168,230,207,0.12);
}

.node-card.running {
  border-color: rgba(0,229,255,0.35);
  background: rgba(0,229,255,0.03);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 0 24px rgba(0,229,255,0.06),
    0 2px 8px rgba(0,0,0,0.3);
}

.node-card.completed {
  border-color: rgba(0,255,198,0.25);
}

.node-card.failed {
  border-color: rgba(255,100,100,0.25);
  background: rgba(255,100,100,0.02);
}

/* Top glow line for completed/failed */
.node-card.completed::before {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--electric-mint), transparent);
  opacity: 0.5;
}

.node-card.failed::before {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  opacity: 0.4;
}

.node-card.running::before {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--glitch-cyan), transparent);
  opacity: 0.5;
  animation: shimmer-line 2s ease-in-out infinite;
}

@keyframes shimmer-line {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* ═══ NODE INTERNALS ════════════════════════════════════ */
.node-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.node-state-icon {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.node-state-icon.pending {
  background: var(--node-fill);
  border: 1.5px solid var(--border);
  color: var(--fg-muted);
}

.node-state-icon.running {
  background: rgba(0,229,255,0.12);
  border: 1.5px solid rgba(0,229,255,0.3);
  color: var(--glitch-cyan);
  animation: pulse-icon 2s ease-in-out infinite;
}

.node-state-icon.completed {
  background: rgba(0,255,198,0.12);
  border: 1.5px solid rgba(0,255,198,0.3);
  color: var(--electric-mint);
}

.node-state-icon.failed {
  background: rgba(255,100,100,0.12);
  border: 1.5px solid rgba(255,100,100,0.3);
  color: var(--red);
}

@keyframes pulse-icon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.node-type-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 7px;
  border-radius: 3px;
}

.node-type-badge.text_prompt { color: var(--mint-deep); background: rgba(127,219,202,0.1); }
.node-type-badge.image_gen { color: var(--electric-mint); background: rgba(0,255,198,0.1); }
.node-type-badge.img2img { color: var(--glitch-cyan); background: rgba(0,229,255,0.1); }
.node-type-badge.upscale { color: var(--amber); background: rgba(245,158,11,0.1); }
.node-type-badge.seed { color: var(--fg-dim); background: rgba(230,255,249,0.05); }
.node-type-badge.inpaint { color: #c084fc; background: rgba(192,132,252,0.1); }
.node-type-badge.outpaint { color: #f472b6; background: rgba(244,114,182,0.1); }
.node-type-badge.ip_adapter { color: #60a5fa; background: rgba(96,165,250,0.1); }
.node-type-badge.remove_bg { color: #34d399; background: rgba(52,211,153,0.1); }
.node-type-badge.face_restore { color: #fb923c; background: rgba(251,146,60,0.1); }

.node-id-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
  margin-left: auto;
}

.node-config-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-dim);
  line-height: 1.5;
  word-break: break-word;
}

.node-error-text {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--red);
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--red-dim);
  border-radius: 4px;
  border: 1px solid rgba(255,100,100,0.15);
  line-height: 1.4;
}

/* ═══ EDGE CONNECTOR ════════════════════════════════════ */
.edge-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  flex-shrink: 0;
  position: relative;
}

.edge-line {
  width: 100%;
  height: 2px;
  background: var(--border-hover);
  border-radius: 1px;
  position: relative;
  transition: all 0.3s ease;
}

.edge-line.completed { background: rgba(0,255,198,0.3); }
.edge-line.failed { background: rgba(255,100,100,0.3); }
.edge-line.running {
  background: var(--glitch-cyan);
  box-shadow: 0 0 12px rgba(0,229,255,0.3);
}

/* Animated dash for running edges */
.edge-line.running {
  background: repeating-linear-gradient(
    90deg,
    var(--glitch-cyan) 0px,
    var(--glitch-cyan) 6px,
    transparent 6px,
    transparent 10px
  );
  background-size: 16px 2px;
  animation: dash-flow 0.8s linear infinite;
}

@keyframes dash-flow {
  0% { background-position: 0 0; }
  100% { background-position: 16px 0; }
}

/* Arrow */
.edge-connector::after {
  content: '';
  position: absolute;
  right: -1px;
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 7px solid var(--border-hover);
  transition: border-color 0.3s ease;
}

.edge-connector.completed::after { border-left-color: rgba(0,255,198,0.3); }
.edge-connector.failed::after { border-left-color: rgba(255,100,100,0.3); }
.edge-connector.running::after { border-left-color: var(--glitch-cyan); }

/* ═══ DIVIDER ═══════════════════════════════════════════ */
.divider {
  border: none;
  height: 1px;
  background: var(--border);
  margin: 28px 0;
  position: relative;
}

.divider::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, var(--electric-mint), transparent);
  opacity: 0.3;
}

/* ═══ EVENT LOG ═════════════════════════════════════════ */
.event-table {
  width: 100%;
  border-collapse: collapse;
}

.event-table th {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: left;
  padding: 8px 14px 8px 0;
  border-bottom: 1px solid var(--border);
}

.event-table td {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 9px 14px 9px 0;
  border-bottom: 1px solid rgba(168,230,207,0.03);
  color: var(--fg-dim);
  vertical-align: top;
  transition: background 0.15s ease;
}

.event-table tr:hover td { background: rgba(168,230,207,0.02); }

.ev-type { font-weight: 600; }
.ev-type.node_start { color: var(--fg-dim); }
.ev-type.node_complete { color: var(--electric-mint); }
.ev-type.node_error { color: var(--red); }
.ev-type.workflow_done { color: var(--glitch-cyan); }

.ev-detail {
  max-width: 440px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ═══ NODE INSPECTOR ════════════════════════════════════ */
.inspector {
  background: var(--node-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 18px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.7;
  overflow-x: auto;
  white-space: pre;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.03),
    0 2px 8px rgba(0,0,0,0.2);
}

.jk { color: var(--mint-deep); }
.js { color: var(--electric-mint); }
.jn { color: var(--glitch-cyan); }
.jb { color: var(--amber); }
.jl { color: var(--fg-muted); }

/* ═══ SCROLLBAR ═════════════════════════════════════════ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(168,230,207,0.12); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(168,230,207,0.22); }

/* ═══ RESPONSIVE ════════════════════════════════════════ */
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 16px; }
}

/* ═══ REDUCED MOTION ════════════════════════════════════ */
  @media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ═══ WORKFLOW BUILDER ════════════════════════════════════ */
.builder { max-width: 820px; }
.builder-title {
  font-family: var(--font-sans);
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.builder-title .accent {
  color: var(--electric-mint);
}
.builder-row {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.builder-input {
  font-family: var(--font-sans);
  font-size: 13px;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--node-fill);
  color: var(--foreground);
  outline: none;
  transition: border-color 0.2s;
}
.builder-input:focus { border-color: var(--mint-deep); }
.builder-input::placeholder { color: var(--fg-muted); }

.builder-input-wide { flex: 1; min-width: 220px; }

/* Dropdown */
.dropdown-wrap { position: relative; display: inline-block; }
.dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: var(--node-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  min-width: 200px;
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  max-height: 320px;
  overflow-y: auto;
}
.dropdown-menu.open { display: block; }
.dropdown-item {
  padding: 8px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--foreground);
  cursor: pointer;
  transition: background 0.15s;
}
.dropdown-item:hover {
  background: rgba(168,230,207,0.06);
}
.dropdown-item .dd-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 8px;
  vertical-align: middle;
}

/* Node builder card */
.builder-node-card {
  background: var(--node-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 14px;
  position: relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 2px 8px rgba(0,0,0,0.2);
}
.builder-node-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.builder-node-actions {
  display: flex;
  gap: 6px;
  margin-left: auto;
}
.builder-icon-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg-muted);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.builder-icon-btn:hover {
  border-color: var(--mint-deep);
  color: var(--foreground);
  background: rgba(168,230,207,0.04);
}
.builder-icon-btn.danger:hover {
  border-color: rgba(255,100,100,0.4);
  color: var(--red);
  background: var(--red-dim);
}

.builder-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.builder-fields .full-width { grid-column: 1 / -1; }

.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.field-group textarea.builder-input {
  resize: vertical;
  min-height: 64px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
}
.field-group select.builder-input {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237FDBCA' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 28px;
}

.builder-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  color: var(--fg-muted);
  font-size: 13px;
  text-align: center;
  gap: 8px;
}
.builder-empty-icon { font-size: 28px; color: var(--mint-deep); }

.builder-output {
  margin-top: 20px;
}
.builder-output pre {
  background: var(--node-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--fg-dim);
  overflow-x: auto;
  white-space: pre;
  max-height: 400px;
  overflow-y: auto;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 11px;
}
.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--node-fill);
  border: 1px solid var(--electric-mint);
  border-radius: var(--radius-sm);
  padding: 10px 18px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--electric-mint);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 16px rgba(0,255,198,0.1);
  z-index: 9999;
  opacity: 0;
  transform: translateY(12px);
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-left">
      <h1>Hermesfy Studio</h1>
      <span class="subtitle">Workflow Audit</span>
    </div>
    <div class="header-right">
      <span class="wf-count" id="wfCount">0 workflows</span>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-header">Workflows</div>
    <div class="sidebar-list" id="workflowList"></div>
    <div class="sidebar-footer">
      <button class="btn" style="margin-bottom:8px;" onclick="openBuilder()">✦ Create Workflow</button>
      <div class="file-input-wrap">
        <button class="btn btn-primary">+ Load JSON</button>
        <input type="file" id="fileInput" accept=".json" multiple>
      </div>
    </div>
  </aside>

  <main class="main" id="mainPanel">
    <div class="empty-state">
      <div class="empty-icon">&#x2B22;</div>
      <div class="empty-text">Select a workflow to inspect</div>
    </div>
  </main>
</div>

<script>
const S = { wfs: {}, sel: null, selNode: null };

const EMOJI = { pending:'\u25CB', running:'\u23F3', completed:'\u2705', failed:'\u274C', retrying:'\u27F3', quality_exhausted:'\u2620' };
const TYPELbl = { text_prompt:'TEXT', image_gen:'GEN', img2img:'IMG2IMG', upscale:'UPSCALE', seed:'SEED', inpaint:'INPAINT', outpaint:'OUTPAINT', ip_adapter:'IP-AD', remove_bg:'RM-BG', face_restore:'FACE' };

function wfState(wf) {
  const ex = wf.execution;
  if (!ex?.node_states) return 'pending';
  const v = Object.values(ex.node_states);
  if (v.every(s => s === 'completed')) return 'completed';
  if (v.some(s => s === 'failed')) return 'failed';
  if (v.some(s => s === 'running')) return 'running';
  return 'pending';
}

function fmtCfg(c) {
  const p = [];
  if (c.prompt) p.push(`prompt="${c.prompt.slice(0,35)}${c.prompt.length>35?'...':''}"`);
  if (c.model) p.push(c.model);
  if (c.width && c.height) p.push(`${c.width}\u00D7${c.height}`);
  if (c.seed !== undefined) p.push(`seed=${c.seed}`);
  return p.join(' \u00B7 ') || '(config)';
}

function hl(json) {
  return JSON.stringify(json, null, 2).replace(
    /("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
    m => {
      if (/^"/.test(m)) return /:$/.test(m) ? `<span class="jk">${m}</span>` : `<span class="js">${m}</span>`;
      if (/true|false/.test(m)) return `<span class="jb">${m}</span>`;
      if (/null/.test(m)) return `<span class="jl">${m}</span>`;
      return `<span class="jn">${m}</span>`;
    }
  );
}

function renderSidebar() {
  const el = document.getElementById('workflowList');
  const ids = Object.keys(S.wfs);
  document.getElementById('wfCount').textContent = `${ids.length} workflow${ids.length!==1?'s':''}`;

  if (!ids.length) {
    el.innerHTML = `<div style="padding:24px 14px;font-size:12px;color:var(--fg-muted);line-height:1.6;">
      No workflows loaded.<br>Click <b style="color:var(--mint-deep)">+ Load JSON</b> to import.</div>`;
    return;
  }

  el.innerHTML = ids.map(id => {
    const wf = S.wfs[id], st = wfState(wf), active = S.sel===id;
    const nc = wf.nodes?.length || 0;
    return `<div class="wf-item ${active?'active':''}" onclick="selWf('${escAttr(id)}')">
      <div class="wf-name">${escH(wf.name||'unnamed')}</div>
      <div class="wf-meta">
        <span class="state-dot ${st}"></span>
        <span>${nc} node${nc!==1?'s':''} \u00B7 ${st}</span>
      </div>
    </div>`;
  }).join('');
}

function renderMain() {
  const panel = document.getElementById('mainPanel');
  if (!S.sel || !S.wfs[S.sel]) {
    panel.innerHTML = `<div class="empty-state">
      <div class="empty-icon">&#x2B22;</div>
      <div class="empty-text">Select a workflow to inspect</div>
    </div>`;
    return;
  }

  const wf = S.wfs[S.sel];
  const ex = wf.execution || {};
  const ns = ex.node_states || {};
  const ne = ex.node_errors || {};
  const ev = ex.events || [];
  const st = wfState(wf);

  const nodes = (wf.nodes||[]).map((n, i) => {
    const s = ns[n.id]||'pending';
    const sel = S.selNode===n.id;
    const err = ne[n.id];
    const tl = TYPELbl[n.type]||n.type?.toUpperCase()||'?';

    let edge = '';
    if (i > 0) {
      const prev = wf.nodes[i-1];
      const ps = ns[prev.id]||'pending';
      let ec = '';
      if (ps==='completed' && s==='completed') ec='completed';
      else if (ps==='failed'||s==='failed') ec='failed';
      else if (s==='running') ec='running';
      edge = `<div class="edge-connector ${ec}"><div class="edge-line ${ec}"></div></div>`;
    }

    const icon = s==='completed'?'\u2713':s==='failed'?'\u2717':s==='running'?'\u25B6':'\u25CB';

    return `${edge}
    <div class="node-card ${s} ${sel?'selected':''}" onclick="selNode('${escAttr(n.id)}')">
      <div class="node-top">
        <div class="node-state-icon ${s}">${icon}</div>
        <span class="node-type-badge ${n.type}">${tl}</span>
        <span class="node-id-label">${escH(n.id)}</span>
      </div>
      <div class="node-config-text">${fmtCfg(n.config||{})}</div>
      ${err?`<div class="node-error-text">\u26A0 ${escH(err.slice(0,100))}${err.length>100?'...':''}</div>`:''}
    </div>`;
  }).join('');

  const rows = ev.slice().reverse().map(e => {
    let det = '';
    if (e.data) {
      if (e.data.error) det = escH(e.data.error);
      else if (e.data.output) det = escH(JSON.stringify(e.data.output).slice(0,140));
      else if (e.data.config) det = escH(JSON.stringify(e.data.config).slice(0,140));
    }
    return `<tr>
      <td style="opacity:0.4;white-space:nowrap;">${escH(e.timestamp||'\u2014')}</td>
      <td>${escH(e.node_id||'')}</td>
      <td class="ev-type ${escAttr(e.event_type)}">${escH(e.event_type||'')}</td>
      <td class="ev-detail">${det}</td>
    </tr>`;
  }).join('');

  let insp = '';
  if (S.selNode) {
    const n = (wf.nodes||[]).find(x=>x.id===S.selNode);
    if (n) {
      const d = { id:n.id, type:n.type, config:n.config||{}, state:ns[n.id]||'pending' };
      if (ne[n.id]) d.error = ne[n.id];
      const nev = ev.filter(e=>e.node_id===n.id);
      if (nev.length) d.events = nev;
      insp = hl(d);
    }
  }

  panel.innerHTML = `
    <div class="wf-header">
      <h2>${escH(wf.name||'unnamed')}</h2>
      <span class="badge ${st}"><span class="badge-dot"></span>${st}</span>
      <span class="wf-id">${escH(wf.id||'')}</span>
    </div>

    <div class="dag-section">
      <div class="section-label">DAG Graph</div>
      <div class="dag-canvas">
        <div class="dag-flow">${nodes.length?nodes:'<span style="opacity:0.3;font-size:12px;">No nodes</span>'}</div>
      </div>
    </div>

    ${ev.length?`<hr class="divider">
    <div class="dag-section">
      <div class="section-label">Event Log</div>
      <table class="event-table">
        <thead><tr><th>Timestamp</th><th>Node</th><th>Event</th><th>Detail</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`:''}

    ${S.selNode?`<hr class="divider">
    <div class="dag-section">
      <div class="section-label">Node Inspector \u2014 ${escH(S.selNode)}</div>
      <div class="inspector">${insp}</div>
    </div>`:''}
  `;
}

function selWf(id) { S.sel=id; S.selNode=null; renderSidebar(); renderMain(); }
function selNode(id) { S.selNode=S.selNode===id?null:id; renderMain(); }

function loadFiles(files) {
  [...files].forEach(f => {
    const r = new FileReader();
    r.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if (d.id) { S.wfs[d.id]=d; S.sel=d.id; renderSidebar(); renderMain(); }
      } catch(err) { console.error('Invalid JSON:', f.name, err); }
    };
    r.readAsText(f);
  });
}

async function autoLoad() {
  try {
    const r = await fetch('/workflows/');
    if (!r.ok) return;
    const data = await r.json();
    const files = Array.isArray(data) ? data : [];
    for (const f of files) {
      const name = f.Name || f.name;
      if (!name?.endsWith('.json')) continue;
      try {
        const resp = await fetch('/workflows/' + name);
        if (resp.ok) {
          const d = await resp.json();
          if (d.id) S.wfs[d.id] = d;
        }
      } catch(e) {}
    }
    if (Object.keys(S.wfs).length) {
      S.sel = Object.keys(S.wfs)[0];
      renderSidebar();
      renderMain();
    }
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════
   WORKFLOW BUILDER
   ═══════════════════════════════════════════════════════════ */

const NODE_TYPES = [
  { key:'text_prompt', label:'TEXT PROMPT', defaultConfig:{prompt:""} },
  { key:'image_gen',   label:'IMAGE GEN',   defaultConfig:{model:"flux-dev",prompt:"",width:1024,height:1024,num_inference_steps:28,guidance_scale:3.5} },
  { key:'img2img',     label:'IMG2IMG',     defaultConfig:{model:"flux-dev",prompt:"",image_url:"",strength:0.4,num_inference_steps:28} },
  { key:'upscale',     label:'UPSCALE',     defaultConfig:{model:"clarity-upscaler",image_url:"",scale:2} },
  { key:'remove_bg',   label:'REMOVE BG',   defaultConfig:{model:"birefnet",image_url:""} },
  { key:'inpaint',     label:'INPAINT',     defaultConfig:{model:"flux-dev",image_url:"",mask_url:"",prompt:""} },
  { key:'outpaint',    label:'OUTPAINT',    defaultConfig:{model:"flux-dev",image_url:"",new_width:1024,new_height:1536} },
  { key:'ip_adapter',  label:'IP ADAPTER',  defaultConfig:{model:"flux-pro",prompt:"",image_url:"",ip_adapter_weight:0.75} },
  { key:'face_restore',label:'FACE RESTORE',defaultConfig:{model:"codeformer",image_url:"",codeformer_fidelity:0.5} },
  { key:'seed',        label:'SEED',        defaultConfig:{seed:42} }
];

const MODELS = ["flux-dev","flux-pro","clarity-upscaler","birefnet","codeformer"];

const B = { name:'', nodes:[], nextId:1, exportJson:null };

function openBuilder() {
  S.sel = null;
  S.selNode = null;
  B.name = 'My Workflow';
  B.nodes = [];
  B.nextId = 1;
  B.exportJson = null;
  renderSidebar();
  renderBuilder();
}

function renderBuilder() {
  const panel = document.getElementById('mainPanel');
  const nodesHtml = B.nodes.length ? B.nodes.map((n, i) => renderBuilderNode(n, i)).join('')
    : `<div class="builder-empty">
         <div class="builder-empty-icon">⬡</div>
         <div>No nodes yet — click <b style="color:var(--electric-mint)">Add Node</b> to start building</div>
       </div>`;

  const exportSection = B.exportJson ? `
    <div class="builder-output">
      <div class="section-label">Export Preview</div>
      <pre id="builderExportPre">${hl(B.exportJson)}</pre>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-sm" onclick="copyExport()">📋 Copy to Clipboard</button>
        <button class="btn btn-sm btn-primary" onclick="loadIntoSidebar()">⬇ Load into Sidebar</button>
      </div>
    </div>` : '';

  panel.innerHTML = `
    <div class="builder">
      <div class="builder-title">
        <span class="accent">✦</span> Workflow Builder
      </div>

      <div class="builder-row">
        <div class="field-group" style="flex:1;min-width:200px;">
          <span class="field-label">Workflow Name</span>
          <input class="builder-input builder-input-wide" type="text" value="${escAttr(B.name)}" placeholder="My Workflow" oninput="B.name=this.value">
        </div>
        <div class="dropdown-wrap">
          <button class="btn btn-primary btn-sm" onclick="toggleDropdown(event)">+ Add Node</button>
          <div class="dropdown-menu" id="addNodeDropdown">
            ${NODE_TYPES.map(nt => `<div class="dropdown-item" onclick="addNode('${nt.key}')">
              ${nt.label}
              <span class="dd-badge node-type-badge ${nt.key}">${TYPELbl[nt.key]||nt.key.toUpperCase()}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>

      ${nodesHtml}

      ${B.nodes.length ? `
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-sm btn-primary" onclick="exportWorkflow()">⬡ Export JSON</button>
      </div>` : ''}

      ${exportSection}
    </div>`;

  // close dropdown on outside click
  document.addEventListener('click', closeDropdownHandler);
}

function renderBuilderNode(n, idx) {
  const total = B.nodes.length;
  const upDisabled = idx === 0;
  const downDisabled = idx === total - 1;

  let fieldsHtml = '';
  const cfg = n.config;
  const typeDef = NODE_TYPES.find(t => t.key === n.type);

  if (n.type === 'image_gen' || n.type === 'img2img' || n.type === 'inpaint' || n.type === 'outpaint' || n.type === 'ip_adapter' || n.type === 'upscale' || n.type === 'remove_bg' || n.type === 'face_restore') {
    // Model dropdown
    const modelsForType = n.type === 'upscale' ? ["clarity-upscaler","real-esrgan"]
      : n.type === 'remove_bg' ? ["birefnet","isnet"]
      : n.type === 'face_restore' ? ["codeformer","gfpgan"]
      : MODELS;
    const modelVal = cfg.model || modelsForType[0];
    fieldsHtml += `<div class="field-group">
      <span class="field-label">Model</span>
      <select class="builder-input" onchange="updateNodeCfg(${n.id},'model',this.value)">
        ${modelsForType.map(m => `<option value="${m}" ${m===modelVal?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>`;
  }

  if (typeDef && 'prompt' in cfg) {
    fieldsHtml += `<div class="field-group full-width">
      <span class="field-label">Prompt</span>
      <textarea class="builder-input" placeholder="Enter prompt..." oninput="updateNodeCfg(${n.id},'prompt',this.value)">${escH(cfg.prompt)}</textarea>
    </div>`;
  }

  if (n.type === 'image_gen') {
    fieldsHtml += fieldNum('Width', 'width', cfg.width, n.id);
    fieldsHtml += fieldNum('Height', 'height', cfg.height, n.id);
    fieldsHtml += fieldNum('Steps', 'num_inference_steps', cfg.num_inference_steps, n.id);
    fieldsHtml += fieldNum('Guidance', 'guidance_scale', cfg.guidance_scale, n.id, true);
  }

  if (n.type === 'img2img') {
    fieldsHtml += fieldText('Image URL', 'image_url', cfg.image_url, n.id);
    fieldsHtml += fieldNum('Strength', 'strength', cfg.strength, n.id, true);
    fieldsHtml += fieldNum('Steps', 'num_inference_steps', cfg.num_inference_steps, n.id);
  }

  if (n.type === 'upscale') {
    fieldsHtml += fieldText('Image URL', 'image_url', cfg.image_url, n.id);
    fieldsHtml += fieldNum('Scale', 'scale', cfg.scale, n.id);
  }

  if (n.type === 'remove_bg') {
    fieldsHtml += fieldText('Image URL', 'image_url', cfg.image_url, n.id, true);
  }

  if (n.type === 'inpaint') {
    fieldsHtml += fieldText('Image URL', 'image_url', cfg.image_url, n.id);
    fieldsHtml += fieldText('Mask URL', 'mask_url', cfg.mask_url, n.id);
  }

  if (n.type === 'outpaint') {
    fieldsHtml += fieldText('Image URL', 'image_url', cfg.image_url, n.id);
    fieldsHtml += fieldNum('New Width', 'new_width', cfg.new_width, n.id);
    fieldsHtml += fieldNum('New Height', 'new_height', cfg.new_height, n.id);
  }

  if (n.type === 'ip_adapter') {
    fieldsHtml += fieldText('Image URL', 'image_url', cfg.image_url, n.id);
    fieldsHtml += fieldNum('Weight', 'ip_adapter_weight', cfg.ip_adapter_weight, n.id, true);
  }

  if (n.type === 'face_restore') {
    fieldsHtml += fieldText('Image URL', 'image_url', cfg.image_url, n.id);
    fieldsHtml += fieldNum('Fidelity', 'codeformer_fidelity', cfg.codeformer_fidelity, n.id, true);
  }

  if (n.type === 'seed') {
    fieldsHtml += fieldNum('Seed', 'seed', cfg.seed, n.id);
  }

  const tl = TYPELbl[n.type] || n.type.toUpperCase();

  return `
    <div class="builder-node-card" data-idx="${idx}">
      <div class="builder-node-header">
        <span class="node-type-badge ${n.type}">${tl}</span>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);">Node ${n.id}</span>
        <div class="builder-node-actions">
          <button class="builder-icon-btn" title="Move up" ${upDisabled?'disabled style="opacity:0.25;cursor:default;"':''} onclick="moveNode(${n.id},-1)">▲</button>
          <button class="builder-icon-btn" title="Move down" ${downDisabled?'disabled style="opacity:0.25;cursor:default;"':''} onclick="moveNode(${n.id},1)">▼</button>
          <button class="builder-icon-btn danger" title="Delete" onclick="deleteNode(${n.id})">✕</button>
        </div>
      </div>
      <div class="builder-fields">${fieldsHtml}</div>
    </div>`;
}

function fieldNum(label, key, val, nodeId, isFloat) {
  return `<div class="field-group">
    <span class="field-label">${label}</span>
    <input class="builder-input" type="number" ${isFloat?'step="0.01"':''} value="${val ?? ''}" onchange="updateNodeCfg(${nodeId},'${key}',${isFloat?'parseFloat(this.value)||0':'parseInt(this.value)||0'})">
  </div>`;
}

function fieldText(label, key, val, nodeId, fullWidth) {
  return `<div class="field-group${fullWidth?' full-width':''}">
    <span class="field-label">${label}</span>
    <input class="builder-input" type="text" value="${escAttr(val||'')}" placeholder="https://..." oninput="updateNodeCfg(${nodeId},'${key}',this.value)">
  </div>`;
}

function addNode(type) {
  const typeDef = NODE_TYPES.find(t => t.key === type);
  if (!typeDef) return;
  const cfg = JSON.parse(JSON.stringify(typeDef.defaultConfig));
  B.nodes.push({ id: B.nextId++, type, config: cfg });
  closeDropdownAll();
  renderBuilder();
}

function deleteNode(id) {
  B.nodes = B.nodes.filter(n => n.id !== id);
  renderBuilder();
}

function moveNode(id, dir) {
  const i = B.nodes.findIndex(n => n.id === id);
  if (i < 0) return;
  const j = i + dir;
  if (j < 0 || j >= B.nodes.length) return;
  [B.nodes[i], B.nodes[j]] = [B.nodes[j], B.nodes[i]];
  renderBuilder();
}

function updateNodeCfg(id, key, val) {
  const n = B.nodes.find(x => x.id === id);
  if (n) n.config[key] = val;
}

function toggleDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('addNodeDropdown');
  dd.classList.toggle('open');
}

function closeDropdownHandler(e) {
  const dd = document.getElementById('addNodeDropdown');
  if (dd && !dd.contains(e.target) && !e.target.closest('.dropdown-wrap')) {
    dd.classList.remove('open');
  }
}

function closeDropdownAll() {
  const dd = document.getElementById('addNodeDropdown');
  if (dd) dd.classList.remove('open');
}

function exportWorkflow() {
  const nodes = B.nodes.map(n => ({ id: 'node_' + n.id, type: n.type, config: JSON.parse(JSON.stringify(n.config)) }));
  const edges = [];
  for (let i = 0; i < nodes.length - 1; i++) {
    edges.push({ source: nodes[i].id, target: nodes[i + 1].id });
  }
  const wf = {
    id: 'wf_' + Date.now(),
    name: B.name || 'Untitled Workflow',
    nodes,
    edges,
    created_at: new Date().toISOString()
  };
  B.exportJson = wf;
  renderBuilder();
  // scroll to export
  setTimeout(() => {
    const el = document.querySelector('.builder-output');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }, 50);
}

function copyExport() {
  if (!B.exportJson) return;
  const text = JSON.stringify(B.exportJson, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    showToast('JSON copied to clipboard');
  }).catch(() => {
    showToast('Failed to copy');
  });
}

function loadIntoSidebar() {
  if (!B.exportJson) return;
  const wf = B.exportJson;
  S.wfs[wf.id] = wf;
  S.sel = wf.id;
  S.selNode = null;
  B.exportJson = null;
  renderSidebar();
  renderMain();
  showToast('Workflow loaded into sidebar');
}

function showToast(msg) {
  let toast = document.getElementById('builderToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'builderToast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

function escAttr(s) { return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('fileInput').addEventListener('change', e => loadFiles(e.target.files));
renderSidebar();
autoLoad();
</script>
</body>
</html>
